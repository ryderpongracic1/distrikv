syntax = "proto3";

package kv;

option go_package = "github.com/ryderpongracic1/distrikv/proto/kvpb";

// KVService is the inter-node RPC interface. All peer-to-peer communication
// goes through this service: client request forwarding, write replication,
// Raft leader election, and Raft heartbeating.
service KVService {
  // ForwardKey proxies a client request from a non-owning node to the
  // consistent-hash ring owner.
  rpc ForwardKey(ForwardKeyRequest) returns (ForwardKeyResponse);

  // Replicate copies a committed mutation from the ring-primary to a replica.
  rpc Replicate(ReplicateRequest) returns (ReplicateResponse);

  // RequestVote is the Raft leader-election RPC (§5.2 of the Raft paper).
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);

  // AppendEntries serves as both the Raft heartbeat and the log-replication
  // RPC (§5.3). An empty Entries slice is a pure heartbeat.
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);

  // PreVote is a dry-run election (Raft dissertation §9.6). The candidate
  // solicits pre-votes without incrementing its term to avoid disrupting the
  // cluster when a partitioned node reconnects.
  rpc PreVote(PreVoteRequest) returns (PreVoteResponse);

  // InstallSnapshot sends a full state-machine snapshot to a follower that
  // has fallen too far behind the leader's log (Raft §7).
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

// ---------------------------------------------------------------------------
// ForwardKey
// ---------------------------------------------------------------------------

message ForwardKeyRequest {
  string method = 1; // "PUT", "GET", or "DELETE"
  string key    = 2;
  bytes  value  = 3; // empty for GET and DELETE
}

message ForwardKeyResponse {
  int32 status_code = 1;
  bytes body        = 2;
}

// ---------------------------------------------------------------------------
// Replicate
// ---------------------------------------------------------------------------

message ReplicateRequest {
  string op    = 1; // "put" or "delete"
  string key   = 2;
  bytes  value = 3; // empty for delete
  uint64 term  = 4; // Raft term at the time of the write

  // seq is the write sequence the ring-primary's storage engine assigned to
  // this mutation. It is monotonic per primary, so for a given key — which has
  // exactly one primary under the consistent-hash ring — a higher seq is
  // strictly newer. Replicas apply-if-newer on it, which is what makes two
  // near-simultaneous writes to one key converge on the same value even when
  // they arrive at a replica in the opposite order.
  //
  // Zero means "no sequence assigned" and is applied unconditionally, so a
  // sender that predates this field still replicates correctly.
  uint64 seq   = 5;

  // replay marks this mutation as one an anti-entropy catch-up pass re-shipped
  // out of the primary's WAL, rather than one the primary is replicating as it
  // serves a client's write.
  //
  // It changes nothing about whether the replica applies the mutation — the seq
  // comparison decides that either way. What it changes is how the replica
  // classifies a *refusal*. A pass covers a range of the log pinned when the pass
  // started, so it can legitimately ship an entry written by an earlier
  // incarnation of the primary, and a newer live write for the same key can
  // already be on the replica. That refusal is the mechanism working, not a
  // primary whose incarnation went backwards, and a receiver that cannot tell
  // them apart raises the epoch-regression alarm on a routine restart.
  //
  // Absent (false) means "live", which is what a sender predating this field
  // sends and what keeps the alarm's coverage where it matters: a primary that
  // lost its state is discovered through the writes it is serving now.
  bool replay  = 6;
}

message ReplicateResponse {
  bool   success = 1;
  string node_id = 2;
}

// ---------------------------------------------------------------------------
// Raft: RequestVote
// ---------------------------------------------------------------------------

message RequestVoteRequest {
  uint64 term           = 1;
  string candidate_id   = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term  = 4;
}

message RequestVoteResponse {
  uint64 term         = 1;
  bool   vote_granted = 2;
}

// ---------------------------------------------------------------------------
// Raft: AppendEntries (heartbeat + log replication)
// ---------------------------------------------------------------------------

message AppendEntriesRequest {
  uint64   term          = 1;
  string   leader_id     = 2;
  uint64   prev_log_index = 3;
  uint64   prev_log_term  = 4;
  repeated LogEntry entries = 5; // empty slice == heartbeat
  uint64   leader_commit  = 6;
}

message AppendEntriesResponse {
  uint64 term    = 1;
  bool   success = 2;
}

// ---------------------------------------------------------------------------
// Raft: PreVote (dry-run election, §9.6 of Raft dissertation)
// ---------------------------------------------------------------------------

message PreVoteRequest {
  uint64 next_term      = 1; // currentTerm+1 — not yet committed
  string candidate_id   = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term  = 4;
}

message PreVoteResponse {
  uint64 term         = 1;
  bool   vote_granted = 2;
}

// ---------------------------------------------------------------------------
// Raft: InstallSnapshot (§7)
// ---------------------------------------------------------------------------

message InstallSnapshotRequest {
  uint64 term                = 1;
  string leader_id           = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term  = 4;
  bytes  data                = 5; // gob-encoded map[string][]byte
}

message InstallSnapshotResponse {
  uint64 term    = 1;
  bool   success = 2;
}

// ---------------------------------------------------------------------------
// Shared types
// ---------------------------------------------------------------------------

// LogEntry is a single record in the Raft log.
message LogEntry {
  uint64 index = 1;
  uint64 term  = 2;
  string op    = 3; // "put" or "delete"
  string key   = 4;
  bytes  value = 5;
}
